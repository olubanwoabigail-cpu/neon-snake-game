<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="/index.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon snake game</title>                
</head>
<body>
    <main class="game-container">
        <header class="game-header">
        <div class="score-card">
         <span class="score-label">SCORE</span>
         <span id="score">0</span>
         </div>

         <div class="game-title">SNAKE<span>.</span></div>
         <div class="score-card">
            <span class="score-label">BEST</span>
            <span id="high-score">0</span>
         </div>
        </header>
        <section class="board-section">
            <canvas id="game-board"></canvas>
        </section>
    <div class="game-footer">
        <p id="message">Press PLAY to start</p>
        <div class="game-buttons">
            <button id="start button">PLAY</button>
            <button id="pause-button">pause-button</button>
        </div>
        </div>
        <div class="settings">
            <label for="difficulty"></label>
            <select id="difficulty">
                <option value="160">Easy</option>
         <option value="110" selected>Medium</option>
         <option value="70">Hard</option> 
            </select>
        </div>
    </main>
   <script src="script.js"></script>
</body>
</html>
